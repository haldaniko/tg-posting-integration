services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://posting:${POSTGRES_PASSWORD}@db:5432/posting
      PHOTO_DIR: /data/photos
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: posting
      POSTGRES_USER: posting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posting"]
      interval: 5s
      retries: 10
volumes:
  postgres:
  photos:

