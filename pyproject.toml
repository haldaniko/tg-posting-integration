[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-posting-integration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot==22.8",
  "SQLAlchemy==2.0.54",
  "psycopg[binary]==3.2.10",
  "httpx==0.28.1",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
tg-posting-bot = "posting_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

