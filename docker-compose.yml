services:
  bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://posting:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/posting
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: posting
      POSTGRES_USER: posting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posting -d posting"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${BOT_DOCKER_SUBNET:-10.243.227.0/24}
